spring:
  application:
    name: bookstore-backend
  # Loads the local .env described in the README so BOOKSTORE_JWT_SECRET resolves without
  # exporting it by hand. Both paths are optional: startup still fails closed when neither the
  # file nor a real environment variable supplies the secret. Real environments inject variables.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  cloud:
    vault:
      enabled: false
  datasource:
    url: jdbc:h2:mem:bookstore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
bookstore:
  security:
    jwt:
      secret: ${BOOKSTORE_JWT_SECRET}
      expiration: PT1H
  cors:
    # Both spellings of the Vite dev origin; a browser on 127.0.0.1 sends a different Origin
    # than one on localhost and would otherwise be rejected. Deployments override this.
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
---
spring:
  config:
    activate:
      on-profile: https
server:
  port: ${HTTPS_SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${HTTPS_KEY_STORE}
    key-store-password: ${HTTPS_KEY_STORE_PASSWORD}
    key-store-type: ${HTTPS_KEY_STORE_TYPE:PKCS12}
    key-alias: ${HTTPS_KEY_ALIAS}
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
---
spring:
  config:
    activate:
      on-profile: vault
    import: vault://
  cloud:
    vault:
      enabled: true
      uri: ${VAULT_ADDR}
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: ${VAULT_KV_BACKEND:secret}
        application-name: ${VAULT_APPLICATION_NAME:bookstore-backend}
        default-context: ${VAULT_DEFAULT_CONTEXT:bookstore}
        profile-separator: /
  datasource:
    url: ${BOOKSTORE_DATASOURCE_URL}
    username: ${BOOKSTORE_DATASOURCE_USERNAME}
    password: ${BOOKSTORE_DATASOURCE_PASSWORD}
    driver-class-name: ${BOOKSTORE_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
---
spring:
  config:
    activate:
      on-profile: observability
logging:
  file:
    name: ${BOOKSTORE_LOG_FILE:logs/bookstore.log}
